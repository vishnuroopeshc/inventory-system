<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Demand Forecast</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/moment"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-moment"></script>
  <style>
    .chart-container {
      width: 90%;
      margin: 20px auto;
      min-height: 500px;
    }
    .product-selector {
      text-align: center;
      margin: 20px 0;
      padding: 10px;
      background: #f8f9fa;
      border-radius: 5px;
    }
    select {
      padding: 8px 15px;
      border-radius: 4px;
      border: 1px solid #ddd;
      margin-left: 10px;
    }
    .loading {
      text-align: center;
      padding: 20px;
      color: #666;
    }
    .error {
      color: #dc3545;
      text-align: center;
      padding: 20px;
    }
  </style>
</head>
<body>

  <div class="container">
    <h2 style="text-align:center;">Product Demand Forecast</h2>
    
    <div class="product-selector">
      <label for="productSelect">Select Product:</label>
      <select id="productSelect" onchange="loadProductData(this.value)">
        {% for product in products %}
        <option value="{{ product }}">{{ product }}</option>
        {% endfor %}
      </select>
    </div>
    
    <div class="chart-container">
      <div id="loading" class="loading">Loading chart data...</div>
      <div id="error" class="error" style="display:none;"></div>
      <canvas id="forecastChart"></canvas>
    </div>
  </div>

  <script>
    // Initialize empty chart
    const ctx = document.getElementById('forecastChart');
    let forecastChart = null;
    
    // Function to initialize or update chart
    function createOrUpdateChart(actualData, forecastData) {
      const labels = [
        ...actualData.map(item => item.date),
        ...forecastData.map(item => item.date)
      ];
      
      if (forecastChart) {
        // Update existing chart
        forecastChart.data.labels = labels;
        forecastChart.data.datasets[0].data = actualData.map(item => ({
          x: item.date,
          y: item.demand
        }));
        forecastChart.data.datasets[1].data = forecastData.map(item => ({
          x: item.date,
          y: item.forecast
        }));
        forecastChart.data.datasets[2].data = forecastData.map(item => ({
          x: item.date,
          y: item.upper - item.forecast
        }));
        forecastChart.update();
      } else {
        // Create new chart
        forecastChart = new Chart(ctx, {
          type: 'line',
          data: {
            labels: labels,
            datasets: [
              {
                label: 'Actual Demand',
                data: actualData.map(item => ({
                  x: item.date,
                  y: item.demand
                })),
                borderColor: 'rgb(75, 192, 192)',
                backgroundColor: 'rgba(75, 192, 192, 0.2)',
                borderWidth: 2,
                pointRadius: 4
              },
              {
                label: 'Forecast',
                data: forecastData.map(item => ({
                  x: item.date,
                  y: item.forecast
                })),
                borderColor: 'rgb(54, 162, 235)',
                backgroundColor: 'rgba(54, 162, 235, 0.2)',
                borderWidth: 2,
                borderDash: [5, 5],
                pointRadius: 3
              },
              {
                label: 'Confidence Interval',
                data: forecastData.map(item => ({
                  x: item.date,
                  y: item.upper - item.forecast
                })),
                backgroundColor: 'rgba(54, 162, 235, 0.1)',
                borderWidth: 0,
                pointRadius: 0,
                fill: '+1'
              }
            ]
          },
          options: {
            responsive: true,
            maintainAspectRatio: true,
            scales: {
              x: {
                type: 'time',
                time: {
                  tooltipFormat: 'MMM D, YYYY',
                  unit: 'month'
                },
                title: {
                  display: true,
                  text: 'Date'
                }
              },
              y: {
                title: {
                  display: true,
                  text: 'Demand Quantity'
                },
                beginAtZero: true
              }
            },
            plugins: {
              tooltip: {
                mode: 'index',
                intersect: false,
                callbacks: {
                  label: function(context) {
                    let label = context.dataset.label || '';
                    if (label) {
                      label += ': ';
                    }
                    if (context.parsed.y !== null) {
                      label += Math.round(context.parsed.y * 10) / 10;
                    }
                    return label;
                  }
                }
              },
              legend: {
                position: 'top',
              }
            }
          }
        });
      }
      
      // Hide loading and error messages
      document.getElementById('loading').style.display = 'none';
      document.getElementById('error').style.display = 'none';
      ctx.style.display = 'block';
    }

    // Function to load product data
    function loadProductData(productType) {
      // Show loading state
      document.getElementById('loading').style.display = 'block';
      document.getElementById('error').style.display = 'none';
      ctx.style.display = 'none';
      
      fetch(`/get_forecast_data?product_type=${encodeURIComponent(productType)}`)
        .then(response => {
          if (!response.ok) {
            return response.json().then(err => { throw new Error(err.error || 'Failed to load data'); });
          }
          return response.json();
        })
        .then(data => {
          createOrUpdateChart(data.actual, data.forecast);
        })
        .catch(error => {
          console.error('Error:', error);
          document.getElementById('loading').style.display = 'none';
          document.getElementById('error').style.display = 'block';
          document.getElementById('error').textContent = error.message;
        });
    }

    // Load data for first product on page load
    document.addEventListener('DOMContentLoaded', function() {
      const firstProduct = document.getElementById('productSelect').value;
      loadProductData(firstProduct);
    });
  </script>
</body>
</html>
